name: Build OTP-2FA-KeyReceiver Android APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Force Gradle 8.7 Wrapper Setup
      run: |
        # Download and configure Gradle 8.7 wrapper properties directly
        mkdir -p gradle/wrapper
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "networkTimeout=10000" >> gradle/wrapper/gradle-wrapper.properties
        echo "validateDistributionUrl=true" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        
        # Download the wrapper jar if not present
        curl -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7/subprojects/wrapper/src/main/resources/gradle-wrapper.jar
        
        # Create gradlew script
        curl -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7/gradlew
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Rename APK file
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OTP-2FA-KeyReceiver.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OTP-2FA-KeyReceiver
        path: app/build/outputs/apk/debug/OTP-2FA-KeyReceiver.apk

name: Build OTP-2FA-KeyReceiver Android APK

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Clean and Build Debug APK
      run: ./gradlew clean assembleDebug --no-build-cache

    - name: Rename APK file
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OTP-2FA-KeyReceiver.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OTP-2FA-KeyReceiver
        path: app/build/outputs/apk/debug/OTP-2FA-KeyReceiver.apk
